name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FluNET.sln
      - name: Build
        run: dotnet build FluNET.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test FluNET.sln --configuration Release --no-build --logger "console;verbosity=normal"
