name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify release gate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/verify-release.sh

      - name: Verify release gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-release.ps1
